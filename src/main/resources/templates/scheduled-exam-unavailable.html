
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy - Exam Unavailable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #1e293b;
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 16px #00000012;
            text-align: center;
        }

        h1 {
            color: #1d4ed8;
        }

        .message {
            margin: 24px 0;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>
    <main class="container">
        <h1>Scheduled Exam Unavailable</h1>

        <p class="message"
           th:text="${errorMessage}">
            This exam is currently unavailable.
        </p>

        <a th:href="@{/dashboard}">Return to Dashboard</a>
    </main>
</body>
</html>
