<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy | Forgot Password</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --primary: #2457a7;
            --secondary: #0f9d91;
            --text: #263449;
            --muted: #718096;
            --border: #e3e9f1;
            --success: #218653;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(36, 87, 167, 0.08), transparent 24rem),
                radial-gradient(circle at top right, rgba(15, 157, 145, 0.08), transparent 18rem),
                var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .card {
            width: min(100%, 420px);
            padding: 34px 28px 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            box-shadow: 0 16px 34px rgba(23, 43, 77, 0.08);
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(2.1rem, 5vw, 2.7rem);
            letter-spacing: -0.05em;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 13, 24, 0.45);
            color: var(--text);
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(96, 165, 250, 0.24);
            border-color: rgba(96, 165, 250, 0.8);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px 18px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #346cbb);
            color: white;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(36, 87, 167, 0.18);
        }

        .success {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(52, 211, 153, 0.09);
            border: 1px solid rgba(52, 211, 153, 0.18);
            color: #bbf7d0;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main class="card">
    <h1>Reset your password</h1>
    <p>Enter your account email. If an account exists, we will send recovery instructions.</p>
    <p class="success" th:if="${success}" th:text="${success}" role="status"></p>
    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" name="requestId" th:value="${requestId}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="254"
               required autocomplete="email">
        <button type="submit">Send recovery instructions</button>
    </form>
    <div class="link"><a th:href="@{/login}">Back to login</a></div>
</main>
</body>
</html>
