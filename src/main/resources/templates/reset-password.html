<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Quizzy | Choose a New Password</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --primary: #2457a7;
            --secondary: #0f9d91;
            --text: #263449;
            --muted: #718096;
            --border: #e3e9f1;
            --danger: #d94b4b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(36, 87, 167, 0.08), transparent 24rem),
                radial-gradient(circle at top right, rgba(15, 157, 145, 0.08), transparent 18rem),
                var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .card {
            width: min(100%, 420px);
            padding: 34px 28px 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            box-shadow: 0 16px 34px rgba(23, 43, 77, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            text-align: center;
            font-size: clamp(2.1rem, 5vw, 2.7rem);
            letter-spacing: -0.05em;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 13, 24, 0.45);
            color: var(--text);
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(96, 165, 250, 0.24);
            border-color: rgba(96, 165, 250, 0.8);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px 18px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #346cbb);
            color: white;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(36, 87, 167, 0.18);
        }

        .error {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(251, 113, 133, 0.09);
            border: 1px solid rgba(251, 113, 133, 0.18);
            color: #fecdd3;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>
<main class="card">
    <div th:replace="~{fragments/quizzy-brand :: brand}"></div>
    <h1>Choose a new password</h1>
    <p class="error" th:if="${error}" th:text="${error}" role="alert"></p>
    <form th:if="${tokenUsable}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="password">New password</label>
        <div style="position: relative;">
            <input id="password" name="password" type="password"
                   minlength="8" maxlength="72" required autocomplete="new-password">
            <button type="button" data-password-toggle="password"
                    style="position:absolute; right:8px; top:50%; transform: translateY(-50%); width:auto; padding:7px 10px; min-width:auto; background: rgba(36, 87, 167, 0.06); border: 1px solid #dfeaf9; box-shadow:none; color:#2457a7; border-radius:8px; font-size:0.8rem; font-weight:700;">
                Show
            </button>
        </div>
        <label for="confirmPassword">Confirm new password</label>
        <div style="position: relative;">
            <input id="confirmPassword" name="confirmPassword" type="password"
                   minlength="8" maxlength="72" required autocomplete="new-password">
            <button type="button" data-password-toggle="confirmPassword"
                    style="position:absolute; right:8px; top:50%; transform: translateY(-50%); width:auto; padding:7px 10px; min-width:auto; background: rgba(36, 87, 167, 0.06); border: 1px solid #dfeaf9; box-shadow:none; color:#2457a7; border-radius:8px; font-size:0.8rem; font-weight:700;">
                Show
            </button>
        </div>
        <button type="submit">Reset password</button>
    </form>
    <p th:if="${!tokenUsable}">
        The reset link cannot be used. You can request a new recovery link.
    </p>
    <div class="link"><a th:href="@{/forgot-password}">Request another link</a></div>
    <div class="link"><a th:href="@{/}">Back to Home</a></div>
</main>
<script>
    document.querySelectorAll('[data-password-toggle]').forEach(function (toggleButton) {
        toggleButton.addEventListener('click', function () {
            const targetId = toggleButton.getAttribute('data-password-toggle');
            const field = document.getElementById(targetId);
            if (!field) return;
            const shouldShow = field.type === 'password';
            field.type = shouldShow ? 'text' : 'password';
            toggleButton.textContent = shouldShow ? 'Hide' : 'Show';
        });
    });
</script>
</body>
</html>
