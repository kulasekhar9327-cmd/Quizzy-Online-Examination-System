
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy Admin Login</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --primary: #2457a7;
            --secondary: #0f9d91;
            --text: #263449;
            --muted: #718096;
            --border: #e3e9f1;
            --danger: #d94b4b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(36, 87, 167, 0.08), transparent 24rem),
                radial-gradient(circle at top right, rgba(15, 157, 145, 0.08), transparent 18rem),
                var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .login-card {
            width: min(100%, 420px);
            padding: 34px 28px 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            box-shadow: 0 16px 34px rgba(23, 43, 77, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: clamp(2.2rem, 5vw, 2.9rem);
            letter-spacing: -0.06em;
        }

        p {
            margin: 0 0 18px;
            text-align: center;
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 13, 24, 0.45);
            color: var(--text);
            font-size: 16px;
        }

        input:focus {
            outline: 3px solid rgba(96, 165, 250, 0.24);
            border-color: rgba(96, 165, 250, 0.8);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #346cbb);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(36, 87, 167, 0.18);
        }

        button:hover {
            filter: brightness(1.05);
        }

        .error {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(251, 113, 133, 0.09);
            border: 1px solid rgba(251, 113, 133, 0.18);
            color: #fecdd3;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>
    <main class="login-card">
        <div th:replace="~{fragments/quizzy-brand :: brand}"></div>
        <h1>Administrator Login</h1>
        <p>Sign in to manage upcoming exams.</p>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/admin/login}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" autocomplete="current-password" required>

            <button type="submit">Admin Login</button>
        </form>
        <p class="link"><a th:href="@{/}">Back to Home</a></p>
    </main>
</body>
</html>
