
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy | Student Login</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --bg-soft: #edf4ff;
            --surface: #ffffff;
            --surface-strong: #f8fbff;
            --primary: #2457a7;
            --secondary: #0f9d91;
            --text: #263449;
            --muted: #718096;
            --border: #e3e9f1;
            --success: #218653;
            --danger: #d94b4b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(36, 87, 167, 0.08), transparent 26rem),
                radial-gradient(circle at top right, rgba(15, 157, 145, 0.08), transparent 20rem),
                var(--bg);
            color: var(--text);
            padding: 24px;
        }

        .card {
            width: min(100%, 420px);
            padding: 34px 28px 26px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            box-shadow: 0 16px 34px rgba(23, 43, 77, 0.08);
        }

        .brand {
            margin: 0;
            font-size: clamp(2.2rem, 6vw, 2.9rem);
            letter-spacing: -0.06em;
            text-align: center;
            color: var(--text);
        }

        .brand span { color: var(--primary); }

        .subtitle {
            margin: 10px 0 22px;
            color: var(--muted);
            text-align: center;
            font-size: 1rem;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0 0 8px;
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px 14px;
            margin: 0 0 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 13, 24, 0.45);
            color: var(--text);
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(96, 165, 250, 0.24);
            border-color: rgba(96, 165, 250, 0.8);
        }

        button {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #346cbb);
            color: white;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(36, 87, 167, 0.18);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .error,
        .success {
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.95rem;
        }

        .error {
            background: rgba(251, 113, 133, 0.09);
            border: 1px solid rgba(251, 113, 133, 0.18);
            color: #fecdd3;
        }

        .success {
            background: rgba(52, 211, 153, 0.09);
            border: 1px solid rgba(52, 211, 153, 0.18);
            color: #bbf7d0;
        }

        .link {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>
    <div class="card">
        <div th:replace="~{fragments/quizzy-brand :: brand}"></div>
        <h1>Student Login</h1>
        <p>Sign in to your student account</p>

        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${param.passwordReset}">
            Your password has been reset. You can now sign in.
        </p>

        <form th:action="@{/login}" method="post">
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email"
                   required autocomplete="email">

            <label for="password">Password</label>
            <div style="position: relative;">
                <input id="password" type="password" name="password"
                       required autocomplete="current-password">
                <button type="button" data-password-toggle="password"
                        style="position:absolute; right:8px; top:50%; transform: translateY(-50%); width:auto; padding:7px 10px; min-width:auto; background: rgba(36, 87, 167, 0.06); border: 1px solid #dfeaf9; box-shadow:none; color:#2457a7; border-radius:8px; font-size:0.8rem; font-weight:700;">
                    Show
                </button>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="link">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <div class="link">
            Don't have an account?
            <a th:href="@{/register}">Register here</a>
        </div>
        <div class="link">
            <a th:href="@{/}">Back to Home</a>
        </div>
    </div>
    <script>
        document.querySelectorAll('[data-password-toggle]').forEach(function (toggleButton) {
            toggleButton.addEventListener('click', function () {
                const targetId = toggleButton.getAttribute('data-password-toggle');
                const field = document.getElementById(targetId);
                if (!field) return;
                const shouldShow = field.type === 'password';
                field.type = shouldShow ? 'text' : 'password';
                toggleButton.textContent = shouldShow ? 'Hide' : 'Show';
            });
        });
    </script>
</body>
</html>
